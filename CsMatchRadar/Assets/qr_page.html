<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码登录</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }
    #qr {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }
    #qr canvas {
        /* 保证在深色主题下二维码依然可扫：白底黑块由 canvas 自己绘制。 */
        border-radius: 4px;
    }
    .err {
        color: #c42b1c;
        font-size: 12px;
        padding: 8px;
        text-align: center;
        word-break: break-all;
    }
</style>
</head>
<body>
<div id="qr"><div class="err">等待二维码…</div></div>
<!-- 先加载编码库，再加载渲染脚本。两者都在本地，无 CDN 依赖。 -->
<script src="qrcode.min.js"></script>
<script src="qr.js"></script>
</body>
</html>
